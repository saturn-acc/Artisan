<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artisan · Chat</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6e7e5;background:#101916;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}header{height:80px;border-bottom:1px solid #ffffff0d;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;letter-spacing:-.5px}.mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid #829c74;border-radius:10px;color:#83bda4;font-family:Georgia,serif;font-size:23px}.status{display:flex;align-items:center;gap:8px;font-size:12px;color:#95aaa0}.dot{width:6px;height:6px;border-radius:50%;background:#476459}.status.on .dot{background:#65c798;box-shadow:0 0 12px #65c79844}.shell{max-width:820px;margin:auto;height:calc(100dvh - 80px);display:flex;flex-direction:column;padding:0 24px}main{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2c5040 transparent;padding:30px 0}.welcome{height:100%;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#87967e;margin-bottom:19px}h1{font-size:38px;letter-spacing:-1.6px;font-weight:500;margin:0 0 14px}.welcome p{font-size:14px;color:#96aaa0;margin:0;line-height:1.7}.suggestion{border:1px solid #28533f;border-radius:9px;background:#123524;color:#a7cdb9;padding:10px 14px;font-size:12px;margin-top:28px}.suggestion:hover{background:#1b4833}.message{display:flex;flex-direction:column;align-items:flex-start;gap:9px;margin:0 0 28px;animation:appear .18s ease}.message.user{align-items:flex-end}.who{font-size:10px;letter-spacing:1.3px;color:#8bad9b;padding:0 3px}.bubble{max-width:90%;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#123524;border:1px solid #2d6047;border-radius:16px 16px 4px 16px;padding:13px 18px;color:#e0eee6}.assistant .bubble{padding:0 3px}.notice{font-size:12px;color:#a0d0b7;margin:0 0 24px;padding:11px 14px;border-left:2px solid #3c946a;background:#112c20;border-radius:0 6px 6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{color:#e8b7a7;border-color:#af7661;background:#251e1b}.composer{padding:12px 0 20px;flex-shrink:0}.inputbox{background:#15271e;border:1px solid #315841;border-radius:16px;padding:17px 16px 12px;box-shadow:0 6px 30px #0002}.inputbox:focus-within{border-color:#4c9873}textarea{display:block;width:100%;min-height:54px;max-height:160px;resize:none;background:transparent;color:#e6e7e5;border:0;outline:0;line-height:1.6;font-size:14px;padding:0}textarea::placeholder{color:#89a293}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.command{background:transparent;border:0;color:#97b5a4;font-size:12px;padding:6px 0}.command:hover{color:#bce5cf}.send{border:0;background:#246b49;color:#f1faf5;border-radius:9px;width:34px;height:34px;font-size:21px;display:grid;place-items:center}.send:hover{background:#318559}.send:disabled{opacity:.4;cursor:default}.foot{text-align:center;font-size:10px;color:#819b8c;margin-top:13px;letter-spacing:.2px}.typing{color:#97b5a4;font-size:12px;padding:0 3px 20px}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){header{padding:0 20px;height:68px}.shell{height:calc(100dvh - 68px);padding:0 18px}h1{font-size:30px}.status{font-size:10px}.foot{font-size:9px}.bubble{max-width:96%}}
.wordmark{color:#83bda4;margin:0 0 26px;width:min(316px,78%);line-height:0}.wordmark svg{display:block;width:100%;height:auto}.brand{color:#83bda4;flex-shrink:0}.brand svg{display:block;width:87px;height:auto}@media(max-width:600px){.brand svg{width:66px}.wordmark{width:min(264px,78%)}}
.new-chat{background:#123524;border:1px solid #2d6047;border-radius:8px;color:#b3d7c3;padding:8px 12px;font-size:12px}.new-chat:hover{background:#1a4832}.new-chat:disabled{opacity:.4;cursor:default}@media(max-width:600px){header>div:last-child{gap:10px!important}.new-chat{padding:7px;font-size:11px}.status span:last-child{max-width:90px}}
/* Phthalo Green anchors surfaces; lighter tints keep text legible. */
:root{--phthalo-green:#123524}
#toggle[aria-pressed="true"]{color:#89d4ad}
button:focus-visible{outline:2px solid #83bda4;outline-offset:4px}
.send{box-shadow:0 0 0 1px #418c65 inset}
</style>
</head>
<body>
<header><div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 124" role="img" aria-label="Artisan"><g fill="currentColor" fill-rule="evenodd"><path transform="translate(0)" d="M0 124V10L10 0H32L42 10V124H26V74H16V124ZM16 16V60H26V16Z"/>
<path transform="translate(50)" d="M0 124V0H32L42 10V58L34 66L42 74V124H26V76L22 72H16V124ZM16 16V56H26V16Z"/>
<path transform="translate(100)" d="M0 0H42V16H29V124H13V16H0Z"/>
<path transform="translate(150)" d="M0 0H16V124H0Z"/>
<path transform="translate(174)" d="M10 0H32L42 10V32H26V16H16V52H32L42 62V114L32 124H10L0 114V92H16V108H26V68H10L0 58V10Z"/>
<path transform="translate(224)" d="M0 124V10L10 0H32L42 10V124H26V74H16V124ZM16 16V60H26V16Z"/>
<path transform="translate(274)" d="M0 124V0H32L42 10V124H26V16H16V124Z"/></g></svg></div><div style="display:flex;align-items:center;gap:20px"><button type="button" id="newChat" class="new-chat">+ New chat</button><div id="status" class="status"><span class="dot"></span><span id="statusText">Speculative decoding off</span></div></div></header>
<div class="shell"><main id="conversation" aria-label="Conversation" aria-live="polite"><div class="welcome" id="welcome"><h1 class="wordmark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 124" role="img" aria-label="Artisan"><g fill="currentColor" fill-rule="evenodd"><path transform="translate(0)" d="M0 124V10L10 0H32L42 10V124H26V74H16V124ZM16 16V60H26V16Z"/>
<path transform="translate(50)" d="M0 124V0H32L42 10V58L34 66L42 74V124H26V76L22 72H16V124ZM16 16V56H26V16Z"/>
<path transform="translate(100)" d="M0 0H42V16H29V124H13V16H0Z"/>
<path transform="translate(150)" d="M0 0H16V124H0Z"/>
<path transform="translate(174)" d="M10 0H32L42 10V32H26V16H16V52H32L42 62V114L32 124H10L0 114V92H16V108H26V68H10L0 58V10Z"/>
<path transform="translate(224)" d="M0 124V10L10 0H32L42 10V124H26V74H16V124ZM16 16V60H26V16Z"/>
<path transform="translate(274)" d="M0 124V0H32L42 10V124H26V16H16V124Z"/></g></svg></h1><p>Send a message to your model.</p><button class="suggestion" id="suggestion">/ Enable speculative decoding</button></div></main>
<form class="composer" id="form"><div class="inputbox"><textarea id="input" rows="2" aria-label="Message" placeholder="Message Artisan…"></textarea><div class="toolbar"><div style="display:flex;gap:18px;align-items:center"><button type="button" class="command" id="command">/ commands</button><button type="button" class="command" id="toggle" aria-pressed="false">Speculative decoding: off</button></div><button class="send" id="send" aria-label="Send message">↑</button></div></div><div class="foot">Enter to send · Shift + Enter for a new line · Runs on your machine</div></form></div>
<script>
const input=document.querySelector('#input'),main=document.querySelector('main'),send=document.querySelector('#send');let busy=false,enabled=false;const welcomeTemplate=document.querySelector('#welcome').cloneNode(true);
function status(on){enabled=on;const toggle=document.querySelector('#toggle');toggle.textContent='Speculative decoding: '+(on?'on':'off');toggle.setAttribute('aria-pressed',String(on));toggle.title=on?'Turn speculative decoding off':'Turn speculative decoding on';document.querySelector('#status').classList.toggle('on',on);document.querySelector('#statusText').textContent='Speculative decoding '+(on?'on':'off')}
function clearWelcome(){document.querySelector('#welcome')?.remove()}
function scroll(){main.scrollTop=main.scrollHeight}
function message(role,text){clearWelcome();const row=document.createElement('div');row.className='message '+role;const label=document.createElement('div');label.className='who';label.textContent=role==='user'?'YOU':'ARTISAN';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(label,bubble);main.append(row);scroll();return row}
function notice(text,error=false){clearWelcome();const row=document.createElement('div');row.className='notice'+(error?' error':'');row.textContent=text;main.append(row);scroll()}
function command(){input.value='/speculative decoding';input.focus()}
document.querySelector('#command').onclick=command;document.querySelector('#suggestion').onclick=command;
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.querySelector('#form').requestSubmit()}});
async function submit(text,isCommand=false){if(!text||busy)return;busy=true;send.disabled=true;document.querySelector('#newChat').disabled=true;document.querySelector('#toggle').disabled=true;if(!isCommand){input.value='';input.style.height='auto'}if(!text.startsWith('/'))message('user',text);const pending=document.createElement('div');pending.className='typing';pending.textContent=text.startsWith('/')?'Updating setting…':'Processing…';main.append(pending);scroll();try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await r.json();pending.remove();if(!r.ok)throw new Error(data.error||'Request failed');status(data.specdecode);if(data.kind==='notice')notice(data.text);else message('assistant',data.text)}catch(error){pending.remove();notice(error.message,true);if(!isCommand)input.value=text}finally{busy=false;send.disabled=false;document.querySelector('#newChat').disabled=false;document.querySelector('#toggle').disabled=false;input.focus()}}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();submit(input.value.trim())});
document.querySelector('#toggle').onclick=()=>submit(enabled?'/speculative decoding off':'/speculative decoding',true);

document.querySelector('#newChat').onclick=async()=>{if(busy)return;busy=true;send.disabled=true;document.querySelector('#newChat').disabled=true;document.querySelector('#toggle').disabled=true;try{const r=await fetch('/new-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not start a new chat');main.replaceChildren(welcomeTemplate.cloneNode(true));document.querySelector('#suggestion').onclick=command;input.value='';input.style.height='auto';status(data.specdecode)}catch(e){notice(e.message,true)}finally{busy=false;send.disabled=false;document.querySelector('#newChat').disabled=false;document.querySelector('#toggle').disabled=false;input.focus()}};
async function init(){send.disabled=true;try{const r=await fetch('/state');if(!r.ok)throw new Error('Could not load chat');const data=await r.json();status(data.specdecode);data.messages.forEach(m=>message(m.role==='user'?'user':'assistant',m.content))}catch(e){notice('Unable to connect to the local chat server. Reload to try again.',true)}finally{send.disabled=false;input.focus()}}init();
</script>
</body></html>
